name: War Room CI

on:
  push:
    branches: [warroom/2026-10-05-integrated-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
